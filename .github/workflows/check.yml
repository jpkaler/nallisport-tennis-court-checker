name: Check Nallisport courts

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay slightly under load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit back seen_slots.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run checker
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python check_courts.py

      - name: Commit updated seen_slots.json
        run: |
          git config user.name "court-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_slots.json
          git diff --staged --quiet || git commit -m "Update seen slots"
          git push
